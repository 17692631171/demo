spring:
  application:
    name: demo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://152.136.175.244:3306/demo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ZYchwl1314..}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # Redis配置
  redis:
    host: ${REDIS_HOST:152.136.175.244}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:chwl1314}
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 0

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false  # 禁用静态资源默认映射
    # 禁用Spring Boot默认的错误处理机制
    problemdetails:
      enabled: false  # 禁用ProblemDetails（Spring Boot 3.x）

# 应用自定义配置
app:
  # CORS配置
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # 安全配置
  security:
    jwt:
      secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production}
      expiration: 86400  # 24小时
      refresh-expiration: 604800  # 7天
    password:
      strength: 10  # BCrypt强度
  # API文档配置
  api-docs:
    enabled: true
    path: /v3/api-docs
    ui:
      path: /swagger-ui.html
      title: Swagger UI
  # 日志配置
  log:
    max-history: 30
    max-file-size: 10MB
    request-log-level: INFO

  # 文件上传配置
  upload:
    max-size: 10MB
    allowed-extensions: ".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx"
    path: ${UPLOAD_PATH:uploads}

  # 验证码配置
  captcha:
    expire-seconds: 300  # 5分钟
    width: 120
    height: 40

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework: WARN
    org.springframework.security: INFO
    com.baomidou.mybatisplus: DEBUG
    org.apache.ibatis: DEBUG

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024